<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HunterTracker — Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="cadastro.css" rel="stylesheet" />
</head>
<body>
  <div class="bg"></div>
  <main class="container">
    <div class="logo-wrap">
      <img src="img/logo-ht.png?v=2" alt="HunterTracker" style="height:52px;width:auto;filter:drop-shadow(0 0 16px rgba(0,212,255,0.45));" />
      <div class="brand-name">HUNTER<span>TRACKER</span></div>
      <div class="brand-tagline">Crie sua conta para continuar</div>
    </div>
    <div class="card">
      <h1 class="card-title">Cadastro</h1>
      <div id="form-cadastro">
        <!-- Nome + Sobrenome -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cad-nome">Nome</label>
            <div class="input-wrap">
              <div class="input-icon" aria-hidden="true">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input class="form-input" id="cad-nome" name="nome" type="text" placeholder="Seu nome" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="cad-sobrenome">Sobrenome</label>
            <div class="input-wrap">
              <div class="input-icon" aria-hidden="true">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input class="form-input" id="cad-sobrenome" name="sobrenome" type="text" placeholder="Sobrenome" required />
            </div>
          </div>
        </div>
        <!-- Nickname -->
        <div class="form-group">
          <label class="form-label" for="cad-nickname">Nickname</label>
          <div class="input-wrap">
            <div class="input-icon" aria-hidden="true">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            </div>
            <input class="form-input" id="cad-nickname" name="nickname" type="text" placeholder="Seu nick no jogo" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="cad-email">E-Mail</label>
          <div class="input-wrap">
            <div class="input-icon" aria-hidden="true">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </div>
            <input class="form-input" id="cad-email" name="email" type="email" placeholder="exemplo@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="cad-senha">Senha</label>
          <div class="input-wrap">
            <div class="input-icon" aria-hidden="true">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input class="form-input" id="cad-senha" name="senha" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required />
          </div>
          <div class="pwd-strength">
            <div class="pwd-bar fill-strong"></div>
            <div class="pwd-bar fill-strong"></div>
            <div class="pwd-bar fill-strong"></div>
            <div class="pwd-bar"></div>
            <span class="pwd-label">Forte</span>
          </div>
        </div>
        <!-- Confirmar senha -->
        <div class="form-group">
          <label class="form-label" for="cad-senha2">Confirmar Senha</label>
          <div class="input-wrap">
            <div class="input-icon" aria-hidden="true">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input class="form-input" id="cad-senha2" name="senha2" type="password" placeholder="Repita a senha" minlength="8" required />
          </div>
        </div>
        <div class="terms-row">
          <input type="checkbox" class="terms-check" id="terms" required />
          <label for="terms" class="terms-text">
            Ao continuar, você concorda com nossos <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
          </label>
        </div>
        <a href="dashboard.html" class="btn-primary" id="btn-cadastro">Criar Conta</a>
        <!-- Link pro login logo abaixo do botão principal, mesmo motivo do login -->
        <div class="login-link">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </div>
        <!-- Divider -->
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">ou continue com</span>
          <div class="divider-line"></div>
        </div>
        <a href="#" class="btn-social">
          <div class="btn-social-left">
            <div class="social-icon">
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M21.17 8H21V8h-1v-1h-1V6h-1V5h-4V4H5v1H4v1H3v1H2v1H1v8h1v1h1v1h1v1h4v1h8v-1h1v-1h1v-1h1v-1h1V8h-1zM9 16H7v-4H6V9h1V8h2v1h1v1h1V9h1V8h2v1h1v3h-1v4h-2v-3h-1v-1H9v1z" fill="#00adef"/></svg>
            </div>
            <span>Continuar com Microsoft</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="#" class="btn-social">
          <div class="btn-social-left">
            <div class="social-icon">
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </div>
            <span>Continuar com Google</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="#" class="btn-social">
          <div class="btn-social-left">
            <div class="social-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-1.97 9.289c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L6.088 14.43l-2.95-.924c-.641-.204-.654-.641.136-.953l11.527-4.445c.537-.194 1.006.131.761.14z"/></svg>
            </div>
            <span>Continuar com Telegram</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="#" class="btn-social">
          <div class="btn-social-left">
            <div class="social-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#1b2838"><rect width="24" height="24" rx="4" fill="#1b2838"/><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z" fill="white"/></svg>
            </div>
            <span>Continuar com Epic Games</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <div class="footer-legal">
          Ao continuar, você concorda com nossos<br>
          <a href="#">Termos de Uso</a> · <a href="#">Política de Privacidade</a>
        </div>
      </div>
    </div>
  </main>
  </body>
</html>
